<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
  </head>
  <body>
    <h1>Hello, World!</h1>
    <div id="translation-container">
      <input type="text" id="input-text" placeholder="Enter text to translate" />
      <button id="translate-to-gauss-button" onclick="translateToGauss()">Translate English to Gausslandian</button>
      <button id="translate-to-english-button" onclick="translateToEnglish()">Translate Gausslandian to English (1 word only, no periods)</button>
      <p id="translated-text" style="font-family: Arial;white-space: pre-wrap;"></p>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
